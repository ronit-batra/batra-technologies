[build]
  command = "npm run build"
  publish = "out"

# Proxy all /api/* requests to your ngrok tunnel (permanent URL)
[[redirects]]
  from = "/api/*"
  to = "https://mandarin-ramp-freely.ngrok-free.dev/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
